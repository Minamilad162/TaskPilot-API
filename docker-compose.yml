services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskpilot-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TaskPilot_Strong_Password123!"
    ports:
      - "1433:1433"
    volumes:
      - taskpilot-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TaskPilot_Strong_Password123! -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskpilot-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskPilotDb;User Id=sa;Password=TaskPilot_Strong_Password123!;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      Jwt__Issuer: "TaskPilot.Api"
      Jwt__Audience: "TaskPilot.Client"
      Jwt__Secret: "taskpilot-development-secret-key-please-change"
      Jwt__ExpirationMinutes: "60"
    ports:
      - "8080:8080"

volumes:
  taskpilot-sqlserver-data:
